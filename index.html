:root{--fondo:#0d1628;--fondo2:#16233d;--fondo3:#1d2d4d;--oro:#f5b82e;--oro2:#ff9d1a;--papel:#f5efe6;--tenue:#aab3c5;--linea:rgba(245,239,230,.13);--rojo:#d52b1e;--azul:#0b3d91;--verde:#57c48a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 70% at 50% 0%,#22345a 0%,var(--fondo) 62%) fixed,var(--fondo);color:var(--papel);font-family:Outfit,system-ui,-apple-system,sans-serif;display:flex;justify-content:center;overflow-x:hidden}
button{font-family:inherit}
.app{width:100%;max-width:560px;min-height:100dvh;padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:18px;position:relative}
.cielo{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cielo i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:brilla 3s ease-in-out infinite alternate}
@keyframes brilla{to{opacity:.1}}
.avioncito{position:fixed;top:12%;left:-80px;z-index:3;width:64px;height:54px;display:flex;align-items:center;justify-content:center;font-size:28px;border:none;background:transparent;padding:0;pointer-events:auto;touch-action:manipulation;animation:cruza 24s linear infinite;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));cursor:pointer;-webkit-user-select:none;user-select:none}
.avioncito:after{content:"";position:absolute;right:80%;top:50%;width:130px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));pointer-events:none}
.avioncito.toque{animation-play-state:paused}
.avioncito.toque span{transform:scale(1.3)}
.avioncito span{display:block;transition:transform .15s}
@keyframes cruza{0%{transform:translate(0,30px)}100%{transform:translate(calc(100vw + 160px),-30px)}}
.menu-b{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:5;width:46px;height:46px;border-radius:14px;border:1px solid var(--linea);background:rgba(22,35,61,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.menu-b i{display:block;width:20px;height:2.5px;border-radius:2px;background:var(--papel)}
.marca{position:relative;z-index:1;text-align:center;font-weight:800;font-size:clamp(42px,13vw,64px);line-height:.92;letter-spacing:-.02em;margin-top:8px}
.marca span{display:block;color:var(--oro);text-shadow:0 0 18px rgba(245,184,46,.45)}
.firma{position:relative;z-index:1;color:var(--oro);font-weight:600;letter-spacing:2px;font-size:13px;margin-top:-6px}
.pregunta{position:relative;z-index:1;color:var(--tenue);font-size:16px;margin:4px 0 0}
.juego{position:relative;z-index:1;width:100%;border:none;padding:0;border-radius:22px;overflow:hidden;cursor:pointer;text-align:left;color:var(--papel);background:var(--fondo2);box-shadow:0 14px 34px rgba(0,0,0,.42),inset 0 0 0 1px var(--linea);transition:transform .15s}
.juego:active{transform:scale(.98)}
.juego .arte{height:150px;position:relative;overflow:hidden}
.juego .arte:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(13,22,40,.92))}
.vida .arte{background:linear-gradient(180deg,#f4f4f4 0 50%,#d52b1e 50%)}
.vida .arte b{position:absolute;left:0;top:0;width:33%;height:50%;background:var(--azul);display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px;z-index:1}

.juego .cuerpo{padding:14px 16px 16px;display:flex;align-items:center;gap:12px}
.juego .txt{flex:1;min-width:0}
.juego h2{margin:0;font-size:22px;font-weight:800;line-height:1.1}
.juego h2 em{font-style:normal;color:var(--oro)}
.juego p{margin:4px 0 0;color:var(--tenue);font-size:14px;line-height:1.35}
.juego .ir{flex:0 0 auto;padding:12px 16px;border-radius:14px;background:var(--oro);color:#2a1b3d;font-weight:800;font-size:16px}
.chapa{position:absolute;top:12px;left:12px;z-index:2;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:1px}
.fly .chapa{background:linear-gradient(90deg,#ff9d1a,#f5b82e);color:#2a1b3d;box-shadow:0 0 16px rgba(255,157,26,.6)}
.vida .chapa{left:auto;right:12px;top:auto;bottom:12px;background:rgba(0,0,0,.45);color:#fff}
.guardado{font-size:12.5px;color:#9fe0b0;margin-top:5px;display:none}
.pie{position:relative;z-index:1;color:var(--tenue);font-size:12.5px;text-align:center;max-width:36ch;line-height:1.45;margin-top:auto;padding-top:8px}
.velo{position:fixed;inset:0;background:var(--fondo);opacity:0;pointer-events:none;transition:opacity .3s;z-index:9;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:var(--oro)}
.velo.on{opacity:1;pointer-events:auto}
/* hoja (ajustes y administrador) */
.fondo-h{position:fixed;inset:0;z-index:20;background:rgba(3,7,15,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
.fondo-h.on{display:flex}
.hoja{width:100%;max-width:560px;max-height:88dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,#1b2a48,#111b30);border:1px solid var(--linea);border-bottom:none;border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.5);animation:sube .25s ease-out}
@keyframes sube{from{transform:translateY(40px);opacity:0}}
.hoja-c{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}
.hoja-c b{font-size:20px}
.hoja-x{width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:16px;cursor:pointer}
.hoja-b{overflow:auto;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.grupo{font-size:12px;letter-spacing:1.5px;color:var(--tenue);margin:14px 2px 8px;font-weight:700}
.calidades{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cal{border:1.5px solid var(--linea);background:rgba(255,255,255,.04);border-radius:14px;padding:11px 12px;text-align:left;color:var(--papel);cursor:pointer}
.cal b{display:block;font-size:16px}.cal small{display:block;color:var(--tenue);font-size:12px;margin-top:2px;line-height:1.3}
.cal.on{border-color:var(--oro);background:rgba(245,184,46,.13)}
.cal.on b:after{content:" ✓";color:var(--oro)}
.op{width:100%;display:flex;align-items:center;gap:12px;border:1.5px solid var(--linea);background:rgba(255,255,255,.04);border-radius:14px;padding:12px;text-align:left;color:var(--papel);cursor:pointer;margin-bottom:8px}
.op i{font-style:normal;font-size:24px;width:36px;text-align:center}
.op b{display:block;font-size:15.5px}.op small{display:block;color:var(--tenue);font-size:12.5px;margin-top:2px;line-height:1.3}
.nota{font-size:13px;color:var(--tenue);line-height:1.45;background:rgba(255,255,255,.04);border-radius:12px;padding:10px 12px;margin:8px 0}
.nota b{color:var(--papel)}
/* administrador */
.adm-in{width:100%;padding:13px 12px;border-radius:12px;border:1.5px solid var(--linea);background:rgba(0,0,0,.25);color:#fff;font-size:16px;margin:6px 0;font-family:inherit}
select.adm-in{appearance:none;-webkit-appearance:none}
.adm-l{display:block;font-size:13px;color:var(--tenue);margin-top:10px}
.adm-bt{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--linea);background:rgba(255,255,255,.06);color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin:6px 0;width:100%;text-decoration:none}
.adm-bt.prim{background:var(--oro);color:#2a1b3d;border-color:var(--oro)}
.adm-bt:disabled{opacity:.45}
.adm-bt.chico{width:auto;padding:7px 10px;font-size:13px;margin:0}
.adm-fila{display:flex;gap:8px}.adm-fila .adm-bt{flex:1}
.adm-msg{margin:8px 0;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.4;background:rgba(255,255,255,.06)}
.adm-msg.ok,.ok{color:#9fe0b0}.adm-msg.mal,.mal{color:#ff8c80}.adm-msg.ama,.ama{color:#ffd27a}
.juegos{display:grid;gap:8px;margin:6px 0}
.jg{display:flex;align-items:center;gap:10px;border:1.5px solid var(--linea);border-radius:14px;padding:10px 12px;cursor:pointer;background:rgba(255,255,255,.04);color:#fff;text-align:left}
.jg.on{border-color:var(--oro);background:rgba(245,184,46,.12)}
.jg i{font-style:normal;font-size:22px}.jg b{display:block}.jg small{color:var(--tenue);font-size:12px}
.jg em{margin-left:auto;font-style:normal;font-size:12px;color:var(--tenue);text-align:right}
.adm-arch{display:block;border:2px dashed rgba(245,184,46,.5);border-radius:14px;padding:16px;text-align:center;cursor:pointer;margin:8px 0;color:var(--oro);font-weight:700}
.adm-arch input{display:none}
.adm-rev div{font-size:13.5px;margin:4px 0}
.adm-v{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--linea)}
.adm-v div{flex:1;min-width:0}.adm-v b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.adm-v small{color:var(--tenue);font-size:12px}
.adm-v em{font-style:normal;font-size:11px;font-weight:800;color:var(--verde)}
@media (min-width:700px){.juego .arte{height:190px}.fondo-h{align-items:center}.hoja{border-radius:22px;border-bottom:1px solid var(--linea)}}
@media (prefers-reduced-motion:reduce){.cielo i{animation:none}}
</style>
</head>

/* ══════════ 1. limpiar el «modo sin internet» viejo (service worker) que hacía que las páginas se reiniciaran ══════════ */
var LIMPIEZA=(function(){
  function limpiar(){var p=[];
    try{if("serviceWorker" in navigator)p.push(navigator.serviceWorker.getRegistrations().then(function(R){return Promise.all(R.map(function(r){return r.unregister().catch(function(){});})).then(function(){return R.length;});}));}catch(e){}
    try{if(window.caches)p.push(caches.keys().then(function(K){return Promise.all(K.map(function(k){return caches.delete(k);})).then(function(){return K.length;});}));}catch(e){}
    return Promise.all(p).then(function(r){return r.reduce(function(a,b){return a+(b||0);},0);}).catch(function(){return 0;});}
  function conTope(pr,ms){return Promise.race([pr,new Promise(function(r){setTimeout(function(){r(0);},ms);})]);}
  var listo=conTope(limpiar(),1500).then(function(n){
    var habia=false;try{habia=!!(navigator.serviceWorker&&navigator.serviceWorker.controller);}catch(e){}
    var ya=false;try{ya=sessionStorage.getItem("cpl_limpio")==="1";}catch(e){}
    if(habia&&!ya){try{sessionStorage.setItem("cpl_limpio","1");}catch(e){}location.reload();}
    return n;});
  return {limpiar:limpiar,listo:listo,conTope:conTope};})();

    if(n){var g=document.getElementById("g-fly");g.textContent="✔ Tienes "+n+(n===1?" piloto guardado":" pilotos guardados");g.style.display="block";}}catch(e){}
  try{var hay=false;for(var k=0;k<localStorage.length;k++){var key=localStorage.key(k);if(/^cpl_vida_/.test(key)||key==="vida_cl_v2"){hay=true;break;}}

  Array.prototype.forEach.call(document.querySelectorAll("[data-ir]"),function(b){b.onclick=function(){var v=document.getElementById("velo");v.textContent=b.classList.contains("fly")?"✈️ Fly Simulator":"🇨🇱 Chilean Pro Life";v.className="velo on";var u=b.getAttribute("data-ir");
    /* primero se asegura de que no quede ningún «modo sin internet» viejo que intercepte la página */
    LIMPIEZA.conTope(LIMPIEZA.limpiar(),1200).then(function(){location.href=u+"?v="+Date.now().toString(36);});};});
  window.addEventListener("pageshow",function(){document.getElementById("velo").className="velo";});
})();

    '<div class="grupo">🧰 SI ALGO NO CARGA</div><button class="op" id="aj-rep"><i>🧹</i><span><b>Reparar el juego</b><small>Borra el «modo sin internet» viejo y la memoria guardada de las páginas. <b>No borra tus partidas.</b></small></span></button>'+
    '<div class="grupo">ℹ️ VERSIÓN</div><div class="nota">Menú Chilean Pro Life · '+verTxt(MI_VERSION)+'</div>');
  b.querySelector("#aj-son").onclick=function(){escribirLS("cplfs_mudo",mudo?null:"1");ajustes();};

      try{sessionStorage.setItem("cpl_limpio","1");}catch(e){}setTimeout(function(){location.replace(location.pathname+"?r="+Date.now().toString(36));},1100);});};});}

/* ══════════ 5. administrador secreto: doble toque al avión ══════════ */
var MI_VERSION=(function(){var m=document.querySelector('meta[name="cpl-version"]');return m?m.getAttribute("content"):null;})();
function verTxt(v){if(!v||!/^\d{12}$/.test(v))return "sin número";return v.slice(6,8)+"/"+v.slice(4,6)+"/"+v.slice(0,4)+" "+v.slice(8,10)+":"+v.slice(10,12);}
(function(){
var av=document.getElementById("avion"),ult=0;
function toque(e){if(e)e.preventDefault();var t=Date.now();av.classList.add("toque");clearTimeout(av._t);av._t=setTimeout(function(){av.classList.remove("toque");},700);
  if(t-ult<550){ult=0;ADMIN.entrada();}else ult=t;}
av.addEventListener("click",toque);
av.addEventListener("dblclick",function(e){e.preventDefault();});
})();

var ADMIN=(function(){
var CLAVES=["cplhub_admin_v1","cpl_admin_v1","cplfs_admin_v1"],FALLOS="cplhub_admin_f",API="https://api.github.com";
var JUEGOS=[{ruta:"index.html",ic:"🏠",n:"Menú Chilean Pro Life",d:"Esta página (la portada con los dos juegos)"},{ruta:"vida.html",ic:"🇨🇱",n:"Chilean Pro Life",d:"La versión normal"},{ruta:"fly.html",ic:"✈️",n:"Fly Simulator",d:"El simulador de vuelo"}];
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function leer(k){try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}}
function escribir(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function versionDe(html){var m=/<meta name="cpl-version" content="(\d+)"/.exec(html||"");return m?m[1]:null;}
function base(){return location.href.split(/[?#]/)[0].replace(/[^\/]*$/,"");}
function enLinea(ruta){if(!/^https?:/.test(location.protocol))return Promise.resolve(null);return fetch(base()+ruta+"?cplv="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.text():null;}).then(versionDe).catch(function(){return null;});}
/* cifrado */
var enc=new TextEncoder(),dec=new TextDecoder();
function b64(buf){var b=new Uint8Array(buf),s="";for(var i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s);}
function deB64(t){var s=atob(t),b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b;}
function llaveDe(codigo,sal){return crypto.subtle.importKey("raw",enc.encode(codigo),"PBKDF2",false,["deriveKey"]).then(function(k){return crypto.subtle.deriveKey({name:"PBKDF2",salt:sal,iterations:250000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);});}
function cifrar(codigo,datos){var sal=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));return llaveDe(codigo,sal).then(function(k){return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},k,enc.encode(JSON.stringify(datos)));}).then(function(ct){return {sal:b64(sal),iv:b64(iv),ct:b64(ct)};});}
function descifrar(codigo,G){return llaveDe(codigo,deB64(G.sal)).then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:deB64(G.iv)},k,deB64(G.ct));}).then(function(p){return JSON.parse(dec.decode(p));});}
/* GitHub */
var S=null;
function gh(metodo,ruta,cuerpo,tok){return fetch(API+ruta,{method:metodo,headers:{"Authorization":"Bearer "+(tok||S.token),"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"},body:cuerpo?JSON.stringify(cuerpo):undefined})
  .then(function(r){return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null;}catch(e){}
    if(!r.ok){var m=j&&j.message?j.message:("error "+r.status);if(r.status===401)m="La llave no sirve o venció (401)";if(r.status===403)m="La llave no tiene permiso para escribir (403): "+m;if(r.status===404)m="No encontré el repositorio o la llave no lo puede ver (404)";throw new Error(m);}
    return j;});});}
function revisarRepo(repo,tok){return gh("GET","/repos/"+repo,null,tok).then(function(R){if(R.permissions&&!R.permissions.push)throw new Error("La llave solo puede leer: dale permiso «Contents: Read and write»");return {rama:R.default_branch,privado:R.private};});}
function commitArchivos(lista,mensaje,_n){_n=_n||0;return commitArchivos1(lista,mensaje).catch(function(e){if(_n<3&&/fast.?forward|not a fast/i.test(e.message||"")){return new Promise(function(ok){setTimeout(ok,1500);}).then(function(){return commitArchivos(lista,mensaje,_n+1);});}throw e;});}
function commitArchivos1(lista,mensaje){var p="/repos/"+S.repo+"/git",cab;
  return gh("GET",p+"/ref/heads/"+encodeURIComponent(S.rama)).then(function(r){cab=r.object.sha;return gh("GET",p+"/commits/"+cab);})
    .then(function(c){return gh("POST",p+"/trees",{base_tree:c.tree.sha,tree:lista.map(function(x){return {path:x.ruta,mode:"100644",type:"blob",sha:x.sha};})});})
    .then(function(t){return gh("POST",p+"/commits",{message:mensaje,tree:t.sha,parents:[cab]});})
    .then(function(c){return gh("PATCH",p+"/refs/heads/"+encodeURIComponent(S.rama),{sha:c.sha}).then(function(){return c;});});}
function blob(b64txt){return gh("POST","/repos/"+S.repo+"/git/blobs",{content:b64txt,encoding:"base64"}).then(function(b){return b.sha;});}
function versiones(ruta){return gh("GET","/repos/"+S.repo+"/commits?sha="+encodeURIComponent(S.rama)+"&path="+encodeURIComponent(ruta)+"&per_page=10");}
function blobEn(commitSha,ruta){return gh("GET","/repos/"+S.repo+"/git/commits/"+commitSha).then(function(c){return gh("GET","/repos/"+S.repo+"/git/trees/"+c.tree.sha+"?recursive=1");})
  .then(function(t){var f=(t.tree||[]).filter(function(x){return x.path===ruta;})[0];if(!f)throw new Error("Esa versión no tiene el archivo "+ruta);return f.sha;});}
/* revisar el archivo según el juego */
function revisarArchivo(txt,ruta){var prob=[],av=[];
  if(ruta==="index.html"){if(txt.indexOf("Chilean")<0||txt.indexOf('data-ir="vida.html"')<0)prob.push("No parece ser el menú (no encontré los botones de los dos juegos).");}
  else{if(txt.length<200000)prob.push("El archivo es muy chico ("+Math.round(txt.length/1024)+" KB): ¿seguro que es el juego completo?");if(txt.indexOf('id="inicio"')<0)prob.push("No parece ser un juego de Chilean Pro Life (no encontré la pantalla de inicio).");
    if(ruta==="fly.html"&&txt.indexOf("Fly Simulator")<0)prob.push("Este archivo no parece ser el Fly Simulator.");
    if(ruta==="vida.html"&&/<title>[^<]*Fly Simulator<\/title>/.test(txt))prob.push("Este archivo es el Fly Simulator, no la versión normal.");}
  var re=/<script(\s[^>]*)?>([\s\S]*?)<\/script>/gi,m,n=0;while((m=re.exec(txt))){if(m[1]&&/\ssrc=/.test(m[1]))continue;n++;try{new Function(m[2]);}catch(e){prob.push("Error de programación en el bloque de código "+n+": "+e.message);}}
  var v=versionDe(txt);if(!v)av.push("El archivo no trae número de versión: los jugadores no recibirán el aviso de actualización.");
  return {prob:prob,av:av,version:v,kb:Math.round(txt.length/1024)};}
function adivinar(nombre,txt){var n=(nombre||"").toLowerCase();if(/fly/.test(n)||(txt&&/<title>[^<]*Fly Simulator<\/title>/.test(txt)))return "fly.html";if(/vida|chileanprolife\.html/.test(n))return "vida.html";if(/index|menu/.test(n)||(txt&&/<(a|button|div)[^>]*data-ir="vida.html"/.test(txt)))return "index.html";return null;}
/* interfaz */
function msg(c,t,tipo){var m=c.querySelector(".adm-msg");if(!m){m=document.createElement("div");c.appendChild(m);}m.className="adm-msg "+(tipo||"");m.innerHTML=t;try{m.scrollIntoView({block:"nearest"});}catch(e){}}
function bloqueo(){var f=leer(FALLOS);if(f&&f.n>=5&&Date.now()-f.t<10*60000)return Math.ceil((10*60000-(Date.now()-f.t))/60000);return 0;}
function guardadas(){return CLAVES.map(function(k){return leer(k);}).filter(Boolean);}
function entrada(){if(!window.crypto||!crypto.subtle){HOJA.abrir("🛠️ Administrador",function(c){c.innerHTML='<div class="nota">⚠️ El modo administrador solo funciona en la página publicada (https://…), no en un archivo descargado.</div>';});return;}
  var G=guardadas();if(!G.length){configurar();return;}
  HOJA.abrir("🛠️ Administrador",function(c){c.innerHTML='<div class="nota">Escribe tu código de administrador (el mismo que usabas en el juego).</div><input class="adm-in" type="password" autocomplete="current-password" placeholder="Código de administrador"><button class="adm-bt prim">🔓 Entrar</button><button class="adm-bt chico olvido" style="margin-top:6px">Olvidé el código / configurar de nuevo</button>';
    var inp=c.querySelector("input"),bt=c.querySelector(".prim");setTimeout(function(){try{inp.focus();}catch(e){}},80);
    function ir(){var b=bloqueo();if(b){msg(c,"🔒 Demasiados intentos. Espera "+b+" min.","mal");return;}bt.disabled=true;msg(c,"Revisando…");
      var i=0;(function probar(){if(i>=G.length){var f=leer(FALLOS)||{n:0,t:0};f.n++;f.t=Date.now();escribir(FALLOS,f);bt.disabled=false;msg(c,"❌ Código incorrecto"+(f.n>=3?" ("+Math.max(0,5-f.n)+" intentos más antes de bloquearse)":""),"mal");return;}
        descifrar(inp.value,G[i]).then(function(d){escribir(FALLOS,null);S=d;if(!leer("cplhub_admin_v1"))cifrar(inp.value,{repo:d.repo,rama:d.rama,token:d.token}).then(function(g2){escribir("cplhub_admin_v1",g2);});panel("vida.html");}).catch(function(){i++;probar();});})();}
    bt.onclick=ir;inp.onkeydown=function(e){if(e.key==="Enter")ir();};
    c.querySelector(".olvido").onclick=function(){if(confirm("Esto borra la llave guardada en ESTE dispositivo. Vas a tener que pegar la llave de GitHub otra vez. ¿Seguir?")){CLAVES.forEach(function(k){escribir(k,null);});configurar();}};});}
function configurar(){HOJA.abrir("🛠️ Configurar administrador",function(c){c.innerHTML='<div class="nota"><b>Solo la primera vez en este dispositivo.</b> Necesitas el repositorio de GitHub conectado a tu sitio de Netlify y una llave de GitHub con permiso <i>Contents: Read and write</i>.</div>'+
  '<label class="adm-l">Repositorio (usuario/nombre)</label><input class="adm-in r" placeholder="usuario/chilean-pro-life" autocapitalize="off" autocorrect="off" spellcheck="false">'+
  '<label class="adm-l">Llave de GitHub (token)</label><input class="adm-in t" type="password" placeholder="github_pat_…" autocapitalize="off" autocorrect="off" spellcheck="false">'+
  '<button class="adm-bt prob">🔎 Probar conexión</button><div class="paso2" style="display:none"><label class="adm-l">Crea tu código de administrador (mínimo 8 caracteres)</label><input class="adm-in c1" type="password" autocomplete="new-password" placeholder="Código nuevo"><input class="adm-in c2" type="password" autocomplete="new-password" placeholder="Repite el código">'+
  '<button class="adm-bt prim guardar">💾 Guardar y entrar</button></div>';
  var info=null;
  c.querySelector(".prob").onclick=function(){var repo=c.querySelector(".r").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/$/,""),tok=c.querySelector(".t").value.trim();
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){msg(c,"Escribe el repositorio como usuario/nombre","mal");return;}if(tok.length<20){msg(c,"Pega la llave completa de GitHub","mal");return;}
    msg(c,"Conectando con GitHub…");revisarRepo(repo,tok).then(function(R){info={repo:repo,token:tok,rama:R.rama};c.querySelector(".paso2").style.display="";msg(c,"✅ Conectado a <b>"+esc(repo)+"</b> (rama "+esc(R.rama)+(R.privado?", privado":", <b>público</b>: mejor hazlo privado")+")","ok");}).catch(function(e){msg(c,"❌ "+esc(e.message),"mal");});};
  c.querySelector(".guardar").onclick=function(){var a=c.querySelector(".c1").value,b=c.querySelector(".c2").value;if(!info){msg(c,"Primero prueba la conexión","mal");return;}
    if(a.length<8){msg(c,"El código debe tener al menos 8 caracteres","mal");return;}if(a!==b){msg(c,"Los códigos no son iguales","mal");return;}msg(c,"Guardando cifrado…");
    cifrar(a,info).then(function(G){if(!escribir("cplhub_admin_v1",G))throw new Error("No se pudo guardar en este navegador");escribir(FALLOS,null);S=info;panel("vida.html");}).catch(function(e){msg(c,"❌ "+esc(e.message),"mal");});};});}
function panel(sel){HOJA.abrir("🛠️ Administrador",function(c){
  c.innerHTML='<div class="nota">Repositorio <b>'+esc(S.repo)+'</b> · rama '+esc(S.rama)+'</div>'+
    '<div class="grupo">1️⃣ ¿QUÉ JUEGO QUIERES ACTUALIZAR?</div><div class="juegos">'+JUEGOS.map(function(j){return '<button class="jg'+(j.ruta===sel?" on":"")+'" data-r="'+j.ruta+'"><i>'+j.ic+'</i><span><b>'+j.n+'</b><small>'+j.d+' · '+j.ruta+'</small></span><em class="v-'+j.ruta.replace(".","_")+'">…</em></button>';}).join("")+
    '<button class="jg'+(sel==="todos"?" on":"")+'" data-r="todos"><i>📦</i><span><b>Los 3 juntos</b><small>Elige los 3 archivos de una vez</small></span></button></div>'+
    '<div class="grupo">2️⃣ SUBE EL ARCHIVO NUEVO</div><label class="adm-arch"><input type="file" accept=".html,text/html"'+(sel==="todos"?" multiple":"")+'><span>📄 '+(sel==="todos"?"Elegir index.html, vida.html y fly.html":"Elegir el archivo .html nuevo")+'</span></label><div class="adm-rev"></div>'+
    '<input class="adm-in men" placeholder="Qué trae esta versión (ej: aviones nuevos)" maxlength="120"><div class="adm-fila"><button class="adm-bt probar" disabled>🧪 Probar antes</button><button class="adm-bt prim subir" disabled>🚀 Publicar</button></div>'+
    (sel!=="todos"?'<div class="grupo">🕓 VERSIONES PUBLICADAS DE '+esc(sel).toUpperCase()+'</div><div class="adm-vers nota">Cargando…</div>':'')+
    '<div class="adm-fila" style="margin-top:12px"><a class="adm-bt" href="https://github.com/'+esc(S.repo)+'" target="_blank" rel="noopener">GitHub ↗</a><a class="adm-bt" href="https://app.netlify.com/" target="_blank" rel="noopener">Netlify ↗</a><button class="adm-bt salir">🔒 Salir</button></div>';
  JUEGOS.forEach(function(j){enLinea(j.ruta).then(function(v){var e=c.querySelector(".v-"+j.ruta.replace(".","_"));if(e)e.innerHTML="en línea<br>"+(v?verTxt(v):"—");});});
  Array.prototype.forEach.call(c.querySelectorAll(".jg"),function(b){b.onclick=function(){panel(b.getAttribute("data-r"));};});
  c.querySelector(".salir").onclick=function(){S=null;HOJA.cerrar();};
  var listos=[];
  c.querySelector("input[type=file]").onchange=function(e){var fs=Array.prototype.slice.call(e.target.files||[]);if(!fs.length)return;var rv=c.querySelector(".adm-rev");rv.innerHTML="Revisando…";listos=[];var pend=fs.length,html="";
    fs.forEach(function(f){var fr=new FileReader();fr.onload=function(){var txt=String(fr.result),ruta=sel==="todos"?adivinar(f.name,txt):sel,R=ruta?revisarArchivo(txt,ruta):{prob:["No supe a qué juego corresponde «"+f.name+"». Llámalo index.html, vida.html o fly.html."],av:[],kb:Math.round(txt.length/1024)};
      html+='<div class="'+(R.prob.length?"mal":"ok")+'"><b>'+esc(f.name)+'</b> → '+esc(ruta||"?")+' · '+R.kb+' KB · versión '+verTxt(R.version)+'</div>'+R.prob.map(function(p){return '<div class="mal">❌ '+esc(p)+'</div>';}).join("")+R.av.map(function(p){return '<div class="ama">⚠️ '+esc(p)+'</div>';}).join("");
      if(!R.prob.length)listos.push({f:f,txt:txt,ruta:ruta,R:R});
      if(--pend===0){var malos=fs.length-listos.length;rv.innerHTML=html+(malos?"":'<div class="ok">✅ Revisado: sin errores de programación.</div>');c.querySelector(".subir").disabled=!!malos||!listos.length;c.querySelector(".probar").disabled=!listos.length;}};fr.readAsText(f);});};
  c.querySelector(".probar").onclick=function(){if(!listos.length)return;var u=URL.createObjectURL(new Blob([listos[0].txt],{type:"text/html"}));var w=window.open(u,"_blank");if(!w)location.href=u;};
  c.querySelector(".subir").onclick=function(){if(!listos.length)return;var men=c.querySelector(".men").value.trim()||("Versión nueva: "+listos.map(function(x){return x.ruta;}).join(", "));
    if(!confirm("¿Publicar para TODOS los jugadores?\n\n"+listos.map(function(x){return "• "+x.ruta;}).join("\n")+"\n\n«"+men+"»"))return;var bt=this;bt.disabled=true;msg(c,"Subiendo… (no cierres esta ventana)");
    Promise.all(listos.map(function(x){return new Promise(function(ok,mal){var fr=new FileReader();fr.onload=function(){var b=String(fr.result);ok(b.slice(b.indexOf(",")+1));};fr.onerror=mal;fr.readAsDataURL(x.f);}).then(blob).then(function(sha){return {ruta:x.ruta,sha:sha};});}))
      .then(function(L){return commitArchivos(L,men);}).then(function(){msg(c,"✅ Subido a GitHub. Si tu Netlify está conectado a este repositorio, lo publica en 1 o 2 minutos.","ok");esperar(listos);})
      .catch(function(e){bt.disabled=false;msg(c,"❌ "+esc(e.message),"mal");});};
  function esperar(L){var n=0;(function mira(){n++;Promise.all(L.map(function(x){return enLinea(x.ruta).then(function(v){return v===x.R.version;});})).then(function(r){if(r.every(Boolean)){msg(c,"🎉 ¡Listo! Ya está en línea para todos.","ok");return;}if(n<24)setTimeout(mira,10000);else msg(c,"⏳ GitHub ya lo tiene, pero el sitio todavía no se actualiza. Revisa Netlify → Deploys (o que el sitio esté conectado a GitHub).","ama");});})();}
  if(sel!=="todos"){var box=c.querySelector(".adm-vers");versiones(sel).then(function(L){if(!L||!L.length){box.textContent="Todavía no hay versiones de "+sel+" en GitHub.";return;}
    box.innerHTML=L.map(function(x,i){var d=new Date(x.commit.author.date);return '<div class="adm-v"><div><b>'+esc(x.commit.message.split("\n")[0])+'</b><small>'+d.toLocaleDateString("es-CL")+" "+d.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"})+" · "+x.sha.slice(0,7)+'</small></div>'+(i===0?'<em>ACTUAL</em>':'<button class="adm-bt chico" data-s="'+x.sha+'">↩️ Volver</button>')+'</div>';}).join("");
    Array.prototype.forEach.call(box.querySelectorAll("[data-s]"),function(b){b.onclick=function(){var sha=b.getAttribute("data-s");if(!confirm("¿Volver a la versión "+sha.slice(0,7)+" de "+sel+" para todos?"))return;b.disabled=true;msg(c,"Volviendo a la versión anterior…");
      blobEn(sha,sel).then(function(bs){return commitArchivos([{ruta:sel,sha:bs}],"↩️ "+sel+": volver a "+sha.slice(0,7));}).then(function(){msg(c,"✅ Listo: el sitio se actualiza en 1 o 2 minutos.","ok");panel(sel);}).catch(function(e){b.disabled=false;msg(c,"❌ "+esc(e.message),"mal");});};});})
    .catch(function(e){box.innerHTML='<span class="mal">❌ '+esc(e.message)+'</span>';});}});}
return {entrada:entrada};})();
</script>
